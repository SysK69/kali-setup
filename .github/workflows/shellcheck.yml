name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck + zsh
        run: sudo apt-get update && sudo apt-get install -y shellcheck zsh

      - name: ShellCheck (bash)
        run: shellcheck -x -s bash -S warning setup.sh bin/tools-sync.sh

      - name: zsh syntax check (update-all)
        run: zsh -n shell/update-all.zsh
